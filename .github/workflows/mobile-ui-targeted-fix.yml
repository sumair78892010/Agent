name: One-shot mobile UI repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[ui-repair]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply verified mobile layout repairs
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/screens/home_screen.dart')
          text = path.read_text(encoding='utf-8')
          original = text

          # The Scaffold already resizes its body for the IME. Adding the
          # keyboard inset again inside the composer double-counts the keyboard
          # height and is the direct cause of the large bottom overflow.
          old_padding = """        16 + MediaQuery.viewInsetsOf(context).bottom,"""
          new_padding = """        16,"""
          if old_padding not in text:
              raise SystemExit('Expected composer keyboard-inset line was not found')
          text = text.replace(old_padding, new_padding, 1)

          # Voice readiness is persistent status, not chat content. The large
          # readiness card consumes scarce mobile vertical space and duplicates
          # information that belongs in Settings. Keep the actual mic button.
          old_panel = """              _buildVoiceControlPanel(isDark),\n\n              // Custom Input bar"""
          new_panel = """              // Voice readiness/status lives in Settings. Keep only the\n              // compact microphone control in the composer.\n\n              // Custom Input bar"""
          if old_panel not in text:
              raise SystemExit('Expected voice control panel insertion was not found')
          text = text.replace(old_panel, new_panel, 1)

          if text == original:
              raise SystemExit('No UI changes were applied')
          path.write_text(text, encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart
          git diff --cached --check
          git commit -m "fix: repair mobile composer and remove chat voice panel [ui-repair]"
          git push
