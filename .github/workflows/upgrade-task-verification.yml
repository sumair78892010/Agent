name: Apply Task Verification Upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'feat: add task verification upgrade') }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified changes
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/services/task_executor.dart'); s=p.read_text(); old='- If stuck after 3 attempts, set is_complete=true and explain in reasoning.\\n'; new='- Never set is_complete=true merely to escape a stuck state. If the goal is not visibly complete, choose a recovery or navigation action instead.\\n'; assert old in s; s=s.replace(old,new,1); old='    // Generic completion still requires non-trivial observable screen state.\\n    return visible.trim().length >= 20;\\n'; new='    // Never accept generic screen content as proof of completion.\\n    // A responsive screen is not evidence that the user goal was achieved.\\n    return false;\\n'; assert old in s; s=s.replace(old,new,1); old=\"        case 'done':\\n          success = true;\\n          actionResult = 'Done step reached';\\n          break;\\n\"; new=\"        case 'done':\\n          success = false;\\n          actionResult = 'Saved skill contained an unverified done marker';\\n          break;\\n\"; assert old in s; s=s.replace(old,new,1); p.write_text(s)"
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/task_executor.dart
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat: add task verification upgrade"
          git push origin main
