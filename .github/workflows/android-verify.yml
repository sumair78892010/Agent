name: Android verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependencies
        run: flutter pub get

      - name: Apply verified task completion migration
        if: ${{ !contains(github.event.head_commit.message, 'task-integrity-fix') }}
        run: |
          python3 tooling/apply_task_integrity_fix.py
          dart format lib/services/task_executor.dart
          git config user.name 'Agent Cypher Maintainer'
          git config user.email 'actions@github.com'
          git add lib/services/task_executor.dart
          if git diff --cached --quiet; then
            echo 'No task completion changes required.'
          else
            git commit -m 'fix: verify task completion against observable state [task-integrity-fix]'
            git push origin main
          fi

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Android debug build
        run: flutter build apk --debug
